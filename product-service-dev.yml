spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5432/microservices_product
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8090


eureka:
  client:
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka
